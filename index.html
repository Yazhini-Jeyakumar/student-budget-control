<!DOCTYPE html>
<html>
<head>
    <title>Student Budget Control</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <p id="datetime"></p>

    <!-- LOGIN -->
    <div class="box">
        <h3>Login / Signup</h3>

        <input type="email" id="email" placeholder="Enter Email">
        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="signup()">Sign Up</button>
        <button onclick="login()">Login</button>
        <button onclick="resetPassword()">Forgot Password</button>
    </div>

    <!-- USER -->
    <h2 id="welcomeUser">Hello 👋</h2>

    <p id="statusMsg"></p>

    <!-- MONTH -->
    <div class="box">
        <h3>Select Month</h3>

        <select id="monthSelect" onchange="loadData()"></select>
    </div>

    <!-- BUDGET -->
    <div class="box">
        <h3>Monthly Budget Plan</h3>

        <input type="number" id="income" placeholder="Monthly Income">

        <input type="number" id="foodBudget" placeholder="Food Budget">

        <input type="number" id="travelBudget" placeholder="Travel Budget">

        <input type="number" id="subBudget" placeholder="Subscriptions Budget">

        <button onclick="saveBudget()">Save Plan</button>
    </div>

    <!-- EXPENSE -->
    <div class="box">
        <h3>Add Expense</h3>

        <input type="number" id="amount" placeholder="Expense Amount">

        <input type="date" id="date">

        <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Subscriptions">Subscriptions</option>
            <option value="Other">Other</option>
        </select>

        <button onclick="addExpense()">Add Expense</button>
    </div>

    <!-- SUMMARY -->
    <div class="box">
        <h3>Summary</h3>

        <p id="remaining">Total Remaining: ₹0</p>

        <h4>Food</h4>
        <p id="foodUsed">Used: ₹0</p>
        <p id="foodLeft">Remaining: ₹0</p>

        <h4>Travel</h4>
        <p id="travelUsed">Used: ₹0</p>
        <p id="travelLeft">Remaining: ₹0</p>

        <h4>Subscriptions</h4>
        <p id="subUsed">Used: ₹0</p>
        <p id="subLeft">Remaining: ₹0</p>

        <h4>Other</h4>
        <p id="otherUsed">Used: ₹0</p>

        <h3>Total Savings Wallet: <span id="savings">₹0</span></h3>

        <p id="savingsInfo"></p>

        <p id="warning">Login to see data</p>
    </div>

    <!-- EXPENSE LIST -->
    <div class="box">
        <h3>Expenses List</h3>

        <ul id="dailyList"></ul>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="firebase.js"></script>
    <script src="script.js"></script>

</body>
</html>
